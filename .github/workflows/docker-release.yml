name: docker-release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: docker-release-main
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  generate-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate next version
        id: version
        shell: bash
        run: |
          major="$(jq -er '.major | select(type == "number" and floor == . and . >= 0)' version.json)"
          minor="$(jq -er '.minor | select(type == "number" and floor == . and . >= 0)' version.json)"

          if [ "$major" -gt 2147483647 ] || [ "$minor" -gt 2147483647 ]; then
            echo "version.json major and minor must not exceed 2147483647."
            exit 1
          fi

          git fetch --force --tags origin

          max_patch=-1
          while IFS= read -r tag; do
            patch=$((10#${tag##*.}))
            if [ "$patch" -gt "$max_patch" ]; then
              max_patch="$patch"
            fi
          done < <(git tag --list "v${major}.${minor}.*" | grep -E "^v${major}\.${minor}\.[0-9]+$" || true)

          patch=$((max_patch + 1))
          version="v${major}.${minor}.${patch}"

          if git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            echo "Version ${version} already exists."
            exit 1
          fi

          git tag "$version" "$GITHUB_SHA"
          git push origin "refs/tags/${version}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Generated version ${version}."

  build-amd64:
    runs-on: ubuntu-24.04
    needs: generate-version

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.generate-version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push amd64 image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
          build-args: |
            PANEL_VERSION=${{ needs.generate-version.outputs.version }}
            PANEL_REPOSITORY=${{ github.repository }}
            PANEL_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-amd64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: generate-version

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.generate-version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Build and push arm64 image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},name-canonical=true,push-by-digest=true,push=true
          cache-from: type=gha,scope=linux-arm64
          cache-to: type=gha,mode=max,scope=linux-arm64
          build-args: |
            PANEL_VERSION=${{ needs.generate-version.outputs.version }}
            PANEL_REPOSITORY=${{ github.repository }}
            PANEL_COMMIT=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image digest
        shell: bash
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-arm64
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    runs-on: ubuntu-24.04
    needs:
      - generate-version
      - build-amd64
      - build-arm64
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.generate-version.outputs.version }}
            type=raw,value=latest
            type=sha

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        shell: bash
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect published image
        shell: bash
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.generate-version.outputs.version }}

      - name: Inspect published latest image
        shell: bash
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.generate-version.outputs.version }}
          name: ${{ needs.generate-version.outputs.version }}
          generate_release_notes: true
          make_latest: true
