version: "3"

vars:
  WEB_DIR: web
  BACKEND_LISTEN_ADDRESS: 127.0.0.1:8080

env:
  GOCACHE: "{{.ROOT_DIR}}/tmp/go-build"

tasks:
  test:appdeploy:
    desc: Test real application deployment scenarios and activity transport adapters
    deps:
      - generate:agent-contract-hash
    cmds:
      - go test ./internal/integration/appdeploy ./internal/modules/applications

  generate:agent-proto:
    desc: Generate Agent protobuf and gRPC bindings (requires protoc and Go plugins)
    cmds:
      - protoc -I internal/agent/proto --go_out=internal/agent/pb --go_opt=paths=source_relative --go-grpc_out=internal/agent/pb --go-grpc_opt=paths=source_relative internal/agent/proto/agent.proto

  test:agent:
    desc: Test Agent event transport, runtime, RPC and contract
    deps:
      - generate:agent-contract-hash
    cmds:
      - go test ./internal/agent/...

  generate:agent-contract-hash:
    desc: Generate the Agent gRPC contract hash
    cmds:
      - go run ./cmd/generate-agent-contract-hash

  run:backend:
    desc: Debug-run backend service
    deps:
      - generate:agent-contract-hash
    env:
      PANEL_LISTEN_ADDRESS: "{{.BACKEND_LISTEN_ADDRESS}}"
    cmds:
      - go run ./cmd/panel

  run:web:
    desc: Debug-run web dev server
    env:
      PANEL_WEB_PROXY_TARGET: "http://{{.BACKEND_LISTEN_ADDRESS}}"
    cmds:
      - npm --prefix {{.WEB_DIR}} run dev

  run:web:test:
    desc: Run web dev server with the built-in Mock API (set AUTH=true to enable auth validation)
    env:
      VITE_PANEL_TEST_MODE: "true"
      VITE_PANEL_TEST_AUTH: "{{.AUTH}}"
    cmds:
      - npm --prefix {{.WEB_DIR}} run dev

  test:
    desc: Run all tests
    cmds:
      - task test:backend
      - task test:web

  test:backend:
    desc: Run backend tests
    deps:
      - generate:agent-contract-hash
    cmds:
      - go test ./...

  test:web:
    desc: Run frontend unit tests (component/E2E/a11y stages return with the v3 rewrite)
    cmds:
      - task test:web:unit

  test:web:unit:
    desc: Run frontend unit tests in the Node environment
    cmds:
      - npm --prefix {{.WEB_DIR}} run test:unit

  build:
    desc: Build backend and frontend
    deps:
      - build:backend
      - build:web

  build:backend:
    desc: Compile backend packages
    deps:
      - generate:agent-contract-hash
    cmds:
      - go build ./...

  build:web:
    desc: Build frontend bundle
    cmds:
      - npm --prefix {{.WEB_DIR}} run build
