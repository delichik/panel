<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Linux Server Panel</title>
    <style>
      .boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #f8fafc;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #d7dee8;
        border-top-color: #2563eb;
        border-radius: 9999px;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status" aria-label="Loading">
        <span class="boot-spinner"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
