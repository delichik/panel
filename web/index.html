<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Seamark</title>
    <script>
      // Resolve the saved theme before first paint so the boot overlay never
      // flashes white when dark mode is enabled.
      (function () {
        try {
          var mode = localStorage.getItem('panel.theme.mode');
          var media = typeof window.matchMedia === 'function' ? window.matchMedia('(prefers-color-scheme: dark)') : null;
          var dark = mode === 'dark' || (mode !== 'light' && !!media && media.matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          // Ignore storage access errors; the CSS fallback below still applies.
        }
      })();
    </script>
    <style>
      :root {
        --boot-bg: #ffffff;
        --boot-track: #d7d7d7;
        --boot-accent: rgba(0, 0, 0, 0.92);
      }
      :root[data-theme='dark'] {
        --boot-bg: #000000;
        --boot-track: rgba(255, 255, 255, 0.16);
        --boot-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --boot-bg: #000000;
          --boot-track: rgba(255, 255, 255, 0.16);
          --boot-accent: #ffffff;
        }
      }
      .boot-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--boot-bg, #ffffff);
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--boot-track, #d7d7d7);
        border-top-color: var(--boot-accent, rgba(0, 0, 0, 0.92));
        border-radius: 9999px;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-screen" role="status" aria-label="Loading">
        <span class="boot-spinner"></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
