  <rect x="186" y="318" width="140" height="30" rx="14" fill="url(#tower)"/>

  <rect x="236" y="148" width="40" height="8" rx="4" fill="#C7D4DE"/>
  <rect x="232" y="188" width="48" height="8" rx="4" fill="#C7D4DE"/>
