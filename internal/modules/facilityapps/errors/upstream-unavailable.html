<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服务暂时不可用</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --surface: #ffffff;
  --muted: rgba(0, 0, 0, 0.035);
  --border: #ededed;
  --text: rgba(0, 0, 0, 0.9);
  --text-secondary: rgba(0, 0, 0, 0.66);
  --text-muted: rgba(0, 0, 0, 0.48);
  --danger: #b91c1c;
  --shadow: 0 8px 22px rgba(0, 0, 0, 0.08);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #070707;
    --muted: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.08);
    --text: rgba(255, 255, 255, 0.92);
    --text-secondary: rgba(255, 255, 255, 0.68);
    --text-muted: rgba(255, 255, 255, 0.48);
    --danger: #f87171;
    --shadow: 0 10px 28px rgba(0, 0, 0, 0.36);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  min-width: 320px;
  display: grid;
  place-items: center;
  padding: 24px 24px 96px;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.panel {
  position: relative;
  z-index: 1;
  width: min(420px, 100%);
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 28px;
  text-align: center;
}
h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.3;
  font-weight: 650;
  letter-spacing: 0;
}
p {
  margin: 4px 0 0;
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-muted);
}
.status-row {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 29px;
  text-align: left;
}
.status-icon {
  flex: 0 0 auto;
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  color: var(--danger);
}
.status-icon svg {
  display: block;
  width: 24px;
  height: 24px;
}
.status-copy {
  min-width: 0;
}
.brand-bottom {
  position: fixed;
  bottom: 20px;
  left: 50%;
  z-index: 1;
  display: grid;
  justify-items: center;
  gap: 4px;
  transform: translateX(-50%);
}
.brand-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.brand-icon {
  display: block;
  width: 28px;
  height: 28px;
  border-radius: 8px;
}
.brand-name {
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0;
}
</style>
</head>
<body>
<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="seamark-icon" viewBox="0 0 512 512">
    <defs>
      <linearGradient id="sm-bg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#16202B"/>
        <stop offset="100%" stop-color="#0E151C"/>
      </linearGradient>
      <linearGradient id="sm-tower" x1="0" x2="1">
        <stop offset="0%" stop-color="#EEF3F7"/>
        <stop offset="100%" stop-color="#D8E2EA"/>
      </linearGradient>
      <linearGradient id="sm-sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2F6E99"/>
        <stop offset="100%" stop-color="#173449"/>
      </linearGradient>
      <radialGradient id="sm-light">
        <stop offset="0%" stop-color="#54F0A3" stop-opacity=".85"/>
        <stop offset="100%" stop-color="#54F0A3" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="sm-clip">
        <rect x="12" y="12" width="488" height="488" rx="110"/>
      </clipPath>
    </defs>
    <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#sm-bg)" stroke="#273541" stroke-width="3"/>
    <circle cx="256" cy="72" r="54" fill="url(#sm-light)"/>
    <polygon points="238,92 274,92 268,112 244,112" fill="#F4F7FA"/>
    <rect x="246" y="70" width="20" height="22" rx="4" fill="#46E89C"/>
    <path d="M226 112 L286 112 L314 318 Q316 334 302 334 L210 334 Q196 334 198 318 Z" fill="url(#sm-tower)"/>
    <rect x="186" y="318" width="140" height="30" rx="14" fill="url(#sm-tower)"/>
    <rect x="236" y="148" width="40" height="8" rx="4" fill="#C7D4DE"/>
    <rect x="232" y="188" width="48" height="8" rx="4" fill="#C7D4DE"/>
    <rect x="228" y="228" width="56" height="8" rx="4" fill="#C7D4DE"/>
    <rect x="224" y="268" width="64" height="8" rx="4" fill="#C7D4DE"/>
    <circle cx="242" cy="152" r="2.5" fill="#3FD68B"/>
    <circle cx="242" cy="192" r="2.5" fill="#3FD68B"/>
    <circle cx="242" cy="232" r="2.5" fill="#3FD68B"/>
    <circle cx="242" cy="272" r="2.5" fill="#3FD68B"/>
    <g clip-path="url(#sm-clip)">
      <path d="M0 336 C90 324 170 348 256 336 C342 324 422 348 512 336 L512 512 L0 512Z" fill="url(#sm-sea)"/>
      <path d="M0 336 C90 324 170 348 256 336 C342 324 422 348 512 336" fill="none" stroke="#5A9DCC" stroke-width="3" stroke-linecap="round" opacity=".75"/>
      <path d="M120 320 Q170 308 220 320 T320 320 T420 320" fill="none" stroke="#5A9DCC" stroke-width="2" opacity=".45" stroke-linecap="round"/>
    </g>
  </symbol>
</svg>
<main class="panel">
  <div class="status-row">
    <div class="status-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 5 3-3"/>
        <path d="m2 22 3-3"/>
        <path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z"/>
        <path d="M7.5 13.5 10 11"/>
        <path d="M10.5 16.5 13 14"/>
        <path d="m12 6 6 6 2.3-2.3a2.4 2.4 0 0 0 0-3.4l-2.6-2.6a2.4 2.4 0 0 0-3.4 0Z"/>
      </svg>
    </div>
    <div class="status-copy">
      <div data-lang="zh">
        <h1>服务暂时不可用</h1>
        <p>服务暂时无法连接，请稍后重试。</p>
      </div>
      <div data-lang="en" hidden>
        <h1>Service temporarily unavailable</h1>
        <p>The service cannot be reached right now. Please try again later.</p>
      </div>
    </div>
  </div>
</main>
<footer class="brand-bottom">
  <div class="brand-row">
    <svg class="brand-icon" viewBox="0 0 512 512" aria-hidden="true"><use href="#seamark-icon"></use></svg>
    <span class="brand-name">Seamark</span>
  </div>
</footer>
<script>
(function () {
  var zh = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
  var target = zh ? 'zh' : 'en';
  document.documentElement.lang = zh ? 'zh-CN' : 'en';
  document.title = zh ? '服务暂时不可用' : 'Service temporarily unavailable';
  var items = document.querySelectorAll('[data-lang]');
  for (var i = 0; i < items.length; i++) {
    items[i].hidden = items[i].getAttribute('data-lang') !== target;
  }
})();
</script>
</body>
</html>
